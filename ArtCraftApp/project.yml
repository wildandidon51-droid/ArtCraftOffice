
name: ArtCraftOffice

options:
  bundleIdPrefix: com.artcraft
  deploymentTarget:
    iOS: "17.0"

targets:
  ArtCraftOffice:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artcraft.office
        PRODUCT_NAME: ArtCraft Office
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
